name: Economic Indicator Bot

on:
  repository_dispatch:
    types: [poll]
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: econ-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DAILY_DIGEST_TIME_KST: ${{ vars.DAILY_DIGEST_TIME_KST }}
          DAILY_DIGEST_WINDOW_MINUTES: ${{ vars.DAILY_DIGEST_WINDOW_MINUTES }}
        run: python -m bot.main

      - name: Commit updated state (if changed)
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "econ-bot"
            git config user.email "econ-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update bot state [skip ci]"
            git push
          else
            echo "state.json 변경 없음 - 커밋 생략"
          fi
